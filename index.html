<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Annecy 2026">
  <meta name="theme-color" content="#0f172a">
  <title>Annecy 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.v61.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-inner">
        <div class="header-left">
          <button id="menu-btn" class="icon-btn" aria-label="Menu"><i class="ph ph-list"></i></button>
          <div class="header-titles">
            <h1 id="header-day-label">Annecy 2026</h1>
            <p id="header-day-subtitle"></p>
          </div>
        </div>
        <div class="header-right">
          <button id="today-btn" class="pill-btn">Today</button>
          <button id="cascade-btn" class="icon-btn cascade-off" title="Ripple: shift all following times when you edit one"><i class="ph ph-arrows-down-up"></i></button>
        </div>
      </div>
      <div id="day-strip-wrap"><div id="day-strip"></div></div>
    </header>

    <main id="main-content">
      <div id="timeline"></div>
      <div id="map-container" class="hidden"></div>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="day"><i class="ph-fill ph-calendar-dots nav-icon"></i><span class="nav-label">Day</span></button>
      <button class="nav-btn" data-view="map"><i class="ph-fill ph-map-trifold nav-icon"></i><span class="nav-label">Map</span></button>
      <button class="nav-btn" data-view="overview"><i class="ph-fill ph-article nav-icon"></i><span class="nav-label">Trip</span></button>
      <button class="nav-btn" data-view="vegan"><i class="ph-fill ph-leaf nav-icon"></i><span class="nav-label">Vegan</span></button>
      <button class="nav-btn" data-view="charging"><i class="ph-fill ph-lightning nav-icon"></i><span class="nav-label">Charging</span></button>
    </nav>
  </div>

  <!-- Side drawer -->
  <div id="drawer-overlay" class="hidden"></div>
  <aside id="drawer" class="hidden">
    <div class="drawer-header">
      <span class="drawer-title">🏔️ Annecy 2026</span>
      <button id="drawer-close" class="icon-btn"><i class="ph ph-x"></i></button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-item" data-action="reset-times"><i class="ph ph-clock-counter-clockwise drawer-icon"></i> Reset all times</button>
      <button class="drawer-item" data-action="reset-checks"><i class="ph ph-check-square drawer-icon"></i> Clear visited</button>
      <button class="drawer-item" data-action="toggle-dark"><i class="ph ph-moon drawer-icon"></i> Toggle dark/light</button>
      <a class="drawer-item" href="https://www.annecy.org/festival" target="_blank" rel="noopener"><i class="ph ph-film-slate drawer-icon"></i> Festival website</a>
      <a class="drawer-item" href="https://www.le-shuttle.com" target="_blank" rel="noopener"><i class="ph ph-train drawer-icon"></i> LeShuttle</a>
      <a class="drawer-item" href="https://www.plugshare.com" target="_blank" rel="noopener"><i class="ph ph-plug drawer-icon"></i> PlugShare</a>
      <a class="drawer-item" href="https://www.happycow.net" target="_blank" rel="noopener"><i class="ph ph-leaf drawer-icon"></i> HappyCow</a>
    </nav>
    <div class="drawer-footer"><p>Works offline · Optimised for iPhone</p></div>
  </aside>

  <!-- Time edit modal -->
  <div id="modal-overlay" class="hidden">
    <div id="time-modal">
      <div class="modal-header">
        <h3 id="modal-title">Edit time</h3>
        <button id="modal-close" class="icon-btn"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body">
        <p id="modal-location" class="modal-location"></p>
        <div class="time-picker-row">
          <button class="time-adj" data-delta="-60">−1h</button>
          <button class="time-adj" data-delta="-15">−15m</button>
          <input type="time" id="modal-time-input">
          <button class="time-adj" data-delta="15">+15m</button>
          <button class="time-adj" data-delta="60">+1h</button>
        </div>
        <label class="cascade-label">
          <input type="checkbox" id="modal-cascade"> Shift all following stops by the same amount
        </label>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="pill-btn secondary">Cancel</button>
        <button id="modal-save" class="pill-btn primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Detail page -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-page">
      <div class="detail-topbar">
        <button id="detail-back" class="icon-btn glass-btn"><i class="ph ph-arrow-left"></i></button>
        <div class="detail-topbar-right">
          <button id="detail-edit-btn" class="icon-btn glass-btn" aria-label="Edit stop"><i class="ph ph-pencil-simple"></i></button>
          <button id="detail-check-btn" class="check-pill">Mark visited</button>
        </div>
      </div>
      <div id="detail-slider-wrap">
        <div id="detail-slides"></div>
        <div id="detail-dots"></div>
      </div>
      <div id="detail-body">
        <div class="detail-meta-row">
          <span id="detail-badge" class="tl-card-badge"></span>
          <span id="detail-time" class="detail-time-lbl"></span>
          <span id="detail-stars" class="priority-stars"></span>
        </div>
        <h2 id="detail-name"></h2>
        <p id="detail-reason"></p>
        <div id="detail-tags"></div>
        <div id="detail-actions"></div>
        <div id="detail-poi-section" class="hidden">
          <div class="detail-section-title">📍 Nearby</div>
          <div id="detail-poi-carousel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit stop sheet -->
  <div id="edit-sheet-overlay" class="hidden">
    <div id="edit-sheet">
      <div class="edit-sheet-handle"></div>
      <div class="edit-sheet-header">
        <h3 class="edit-sheet-title">Edit stop</h3>
        <button id="edit-sheet-close" class="icon-btn"><i class="ph ph-x"></i></button>
      </div>
      <div class="edit-sheet-body">

        <section class="edit-section">
          <div class="edit-section-label">Stop name</div>
          <input type="text" id="edit-name" class="edit-input" placeholder="Location name">
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Location</div>
          <div class="edit-search-wrap">
            <input type="search" id="edit-loc-search" class="edit-input" placeholder="Search for a place…" autocomplete="off">
            <div id="edit-loc-results" class="edit-loc-results"></div>
          </div>
          <div id="edit-map-el" class="edit-map"></div>
          <p class="edit-hint">Drag the pin to fine-tune</p>
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Arrival time</div>
          <input type="time" id="edit-time" class="edit-input">
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Time at stop</div>
          <div class="dur-picker">
            <div class="dur-col-wrap"><div id="dur-hours" class="dur-col"></div></div>
            <div class="dur-sep">:</div>
            <div class="dur-col-wrap"><div id="dur-mins" class="dur-col"></div></div>
          </div>
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Stop type</div>
          <div id="edit-type-grid" class="type-pill-grid"></div>
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Priority</div>
          <div id="edit-priority-grid" class="priority-opt-grid"></div>
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Card description</div>
          <textarea id="edit-reason" class="edit-textarea" rows="3" placeholder="What's special about this stop?"></textarea>
        </section>

        <section class="edit-section">
          <label class="edit-toggle-row">
            <div>
              <div class="edit-toggle-label"><i class="ph ph-leaf"></i> Vegan-friendly</div>
              <div class="edit-toggle-sub">Show vegan nearby button on this stop</div>
            </div>
            <input type="checkbox" id="edit-vegan" class="edit-toggle-cb">
          </label>
        </section>

      </div>
      <div class="edit-sheet-footer">
        <button id="edit-save-btn" class="pill-btn primary">Save changes</button>
        <button id="edit-recalc-btn" class="pill-btn recalc">⏱ Recalculate following stops</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script>
    // window.innerHeight is the true physical screen height in standalone
    // PWA mode — more reliable than any CSS unit on iOS WebKit
    (function() {
      function setRealHeight() {
        document.documentElement.style.setProperty('--real-height', window.innerHeight + 'px');
      }
      setRealHeight();
      window.addEventListener('resize', setRealHeight);
      window.addEventListener('orientationchange', function() { setTimeout(setRealHeight, 200); });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'SW_UPDATED') window.location.reload();
      });
      // updateViaCache:'none' bypasses HTTP cache when fetching sw.js itself,
      // so standalone PWAs always pick up new versions without needing a cache clear
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => reg.update());
    }
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
