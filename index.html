<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Annecy 2026">
  <meta name="theme-color" content="#0f172a">
  <title>Annecy 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.v113.css">
</head>
<body>
  <div id="app">
    <div id="bg-clip"><div id="bg-layer"></div></div>
    <header id="app-header">
      <div class="header-inner">
        <div class="header-left">
          <button id="menu-btn" class="icon-btn" aria-label="Menu"><i class="ph ph-list"></i></button>
          <div class="header-titles">
            <h1 id="header-day-label">Annecy 2026</h1>
            <p id="header-day-subtitle"></p>
          </div>
        </div>
        <div class="header-right">
          <span id="sync-dot" data-status="connected" title="Sync"></span>
          <button id="compact-btn" class="icon-btn" title="Compact view"><i class="ph ph-rows"></i></button>
          <button id="cascade-btn" class="icon-btn cascade-off" title="Ripple: shift all following times when you edit one"><i class="ph ph-arrows-down-up"></i></button>
        </div>
      </div>
      <div id="day-strip-wrap"><div id="day-strip"></div></div>
    </header>

    <main id="main-content">
      <div id="timeline"></div>
      <div id="map-container" class="hidden"></div>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="day"><i class="ph ph-calendar-dots nav-icon"></i><span class="nav-label">Day</span></button>
      <button class="nav-btn" data-view="map"><i class="ph ph-map-trifold nav-icon"></i><span class="nav-label">Map</span></button>
<button class="nav-btn" data-view="vegan"><i class="ph ph-leaf nav-icon"></i><span class="nav-label">Vegan</span></button>
      <button class="nav-btn" data-view="charging"><i class="ph ph-lightning nav-icon"></i><span class="nav-label">Charging</span></button>
    </nav>
  </div>

  <!-- Side drawer -->
  <div id="drawer-overlay" class="hidden"></div>
  <aside id="drawer" class="hidden">
    <div class="drawer-header">
      <span class="drawer-title"><i class="ph ph-mountains"></i> Annecy 2026</span>
      <button id="drawer-close" class="icon-btn"><i class="ph ph-x"></i></button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-item" data-action="home"><i class="ph ph-house drawer-icon"></i> Home</button>
      <a class="drawer-item" href="https://www.annecy.org/festival" target="_blank" rel="noopener"><i class="ph ph-film-slate drawer-icon"></i> Festival website</a>
      <a class="drawer-item" href="https://www.le-shuttle.com" target="_blank" rel="noopener"><i class="ph ph-train drawer-icon"></i> LeShuttle</a>
      <a class="drawer-item" href="https://www.plugshare.com" target="_blank" rel="noopener"><i class="ph ph-plug drawer-icon"></i> PlugShare</a>
      <a class="drawer-item" href="https://www.happycow.net" target="_blank" rel="noopener"><i class="ph ph-leaf drawer-icon"></i> HappyCow</a>
    </nav>
    <div class="drawer-bottom">
      <button class="drawer-item" data-action="toggle-dark" id="dark-mode-btn"><i class="ph ph-moon drawer-icon" id="dark-mode-icon"></i> <span id="dark-mode-label">Dark mode</span></button>
      <div class="drawer-settings-wrap">
        <button class="drawer-item drawer-settings-toggle" id="settings-toggle">
          <i class="ph ph-gear drawer-icon"></i> Settings
          <i class="ph ph-caret-right drawer-caret" id="settings-caret"></i>
        </button>
        <div class="drawer-settings-body" id="settings-body">
          <button class="drawer-item drawer-sub-item" id="gyro-btn"><i class="ph ph-compass drawer-icon"></i> <span id="gyro-label">Motion disabled</span></button>
          <button class="drawer-item drawer-sub-item" id="notif-btn"><i class="ph ph-bell drawer-icon"></i> <span id="notif-label">Departure alerts off</span></button>
          <button class="drawer-item drawer-sub-item" id="notif-test-btn" style="display:none"><i class="ph ph-paper-plane-tilt drawer-icon"></i> Send test push</button>
          <button class="drawer-item drawer-sub-item" id="units-btn"><i class="ph ph-ruler drawer-icon"></i> <span id="units-label">Distances in km</span></button>
          <button class="drawer-item drawer-sub-item" data-action="reset-times"><i class="ph ph-clock-counter-clockwise drawer-icon"></i> Reset all times</button>
          <button class="drawer-item drawer-sub-item" data-action="reset-checks"><i class="ph ph-check-square drawer-icon"></i> Clear visited</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Time edit modal -->
  <div id="modal-overlay" class="hidden">
    <div id="time-modal">
      <div class="modal-header">
        <h3 id="modal-title">Edit time</h3>
        <button id="modal-close" class="icon-btn"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body">
        <p id="modal-location" class="modal-location"></p>
        <div class="time-picker-row">
          <button class="time-adj" data-delta="-60">−1h</button>
          <button class="time-adj" data-delta="-15">−15m</button>
          <input type="time" id="modal-time-input">
          <button class="time-adj" data-delta="15">+15m</button>
          <button class="time-adj" data-delta="60">+1h</button>
        </div>
        <label class="cascade-label">
          <input type="checkbox" id="modal-cascade"> Shift all following stops by the same amount
        </label>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="pill-btn secondary">Cancel</button>
        <button id="modal-save" class="pill-btn primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Detail page -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-page">
      <div class="detail-topbar">
        <button id="detail-back" class="icon-btn glass-btn"><i class="ph ph-arrow-left"></i></button>
        <div class="detail-topbar-right">
          <button id="detail-edit-btn" class="icon-btn glass-btn" aria-label="Edit stop"><i class="ph ph-pencil-simple"></i></button>
          <button id="detail-check-btn" class="check-pill">Mark visited</button>
        </div>
      </div>
      <div id="detail-slider-wrap">
        <div id="detail-slides"></div>
        <div id="detail-dots"></div>
      </div>
      <div id="detail-body">
        <div class="detail-meta-row">
          <span id="detail-badge" class="tl-card-badge"></span>
          <span id="detail-time" class="detail-time-lbl"></span>
          <span id="detail-leaveby"></span>
          <span id="detail-stars" class="priority-stars"></span>
        </div>
        <h2 id="detail-name"></h2>
        <div id="detail-weather" class="detail-weather-row hidden"></div>
        <p id="detail-reason"></p>
        <div id="detail-tags"></div>
        <div id="detail-actions"></div>
        <div id="detail-poi-section" class="hidden">
          <div class="detail-section-title"><i class="ph ph-map-pin"></i> Nearby</div>
          <div id="detail-poi-carousel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit stop sheet -->
  <div id="edit-sheet-overlay" class="hidden">
    <div id="edit-sheet">
      <div class="edit-sheet-handle"></div>
      <div class="edit-sheet-header">
        <h3 class="edit-sheet-title">Edit stop</h3>
        <button id="edit-sheet-close" class="icon-btn"><i class="ph ph-x"></i></button>
      </div>
      <div class="edit-sheet-body">

        <section class="edit-section">
          <div class="edit-section-label">Stop name</div>
          <input type="text" id="edit-name" class="edit-input" placeholder="Location name">
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Location</div>
          <div class="edit-search-wrap">
            <div class="edit-search-row">
              <input type="search" id="edit-loc-search" class="edit-input" placeholder="Search for a place…" autocomplete="off" autocorrect="off" spellcheck="false">
              <button id="edit-loc-search-btn" class="edit-search-btn" type="button"><i class="ph ph-magnifying-glass"></i></button>
            </div>
            <div id="edit-loc-results" class="edit-loc-results"></div>
          </div>
          <div id="edit-map-el" class="edit-map"></div>
          <p class="edit-hint">Tap map to place pin · drag to fine-tune</p>
        </section>

        <section class="edit-section">
          <div class="ios-list-section">
            <div class="seg-control seg-control-inset" id="time-type-seg">
              <button class="seg-btn active" data-seg="departure">Departure</button>
              <button class="seg-btn" data-seg="arrival">Arrival</button>
            </div>
            <label class="ios-list-row">
              <span class="ios-list-label">Time</span>
              <input type="time" id="edit-time" class="ios-time-input">
            </label>
          </div>
        </section>

        <section class="edit-section" id="dur-section">
          <div class="ios-list-section">
            <label class="ios-list-row">
              <span class="ios-list-label">Time at stop</span>
              <input type="time" id="edit-dur-native" class="ios-time-input" step="300">
            </label>
          </div>
        </section>

        <section class="edit-section">
          <div class="ios-list-section">
            <div class="ios-list-row">
              <span class="ios-list-label">Stop type</span>
              <select id="edit-type-select" class="ios-list-select"></select>
            </div>
            <div class="ios-list-row">
              <span class="ios-list-label">Priority</span>
              <div id="edit-stars" class="star-picker"></div>
            </div>
          </div>
        </section>

        <section class="edit-section">
          <div class="edit-section-label">Card description</div>
          <textarea id="edit-reason" class="edit-textarea" rows="3" placeholder="What's special about this stop?"></textarea>
        </section>

        <section class="edit-section">
          <label class="edit-toggle-row">
            <div>
              <div class="edit-toggle-label"><i class="ph ph-leaf"></i> Vegan-friendly</div>
              <div class="edit-toggle-sub">Show vegan nearby button on this stop</div>
            </div>
            <input type="checkbox" id="edit-vegan" class="edit-toggle-cb">
          </label>
        </section>

      </div>
      <div class="edit-sheet-footer">
        <button id="edit-save-btn" class="pill-btn primary">Save changes</button>
        <button id="edit-recalc-btn" class="pill-btn recalc">⏱ Recalculate following stops</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script>
    // window.innerHeight is the true physical screen height in standalone
    // PWA mode — more reliable than any CSS unit on iOS WebKit
    (function() {
      // Measure header height so #main-content padding-top clears it.
      // Called after fonts/icons load and on resize.
      function updateHeaderHeight() {
        var hdr = document.getElementById('app-header');
        if (hdr) document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px');
      }
      // Run once DOM is ready, again after a short delay for icon fonts
      document.addEventListener('DOMContentLoaded', function() {
        updateHeaderHeight();
        setTimeout(updateHeaderHeight, 300);
      });
      window.addEventListener('resize', updateHeaderHeight);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'SW_UPDATED') window.location.reload();
      });
      // updateViaCache:'none' bypasses HTTP cache when fetching sw.js itself,
      // so standalone PWAs always pick up new versions without needing a cache clear
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => reg.update());
    }
  </script>
  <!-- Firebase (compat SDK — no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="data.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
