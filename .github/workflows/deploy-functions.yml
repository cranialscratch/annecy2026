name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: cd functions && npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Create functions .env file with VAPID keys
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          echo "VAPID_PUBLIC=BKmi-0vUYQ0nUypNal5_NwVmkXlLqxVtyxMOGZLVBGDkE4K96Bo5FhiM_0lza3z9-M0wRIOVA5QN7Ou0yo6XvMc" > functions/.env
          echo "VAPID_PRIVATE=${VAPID_PRIVATE}" >> functions/.env

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: firebase deploy --only functions --project annecy-2026 --non-interactive --force
