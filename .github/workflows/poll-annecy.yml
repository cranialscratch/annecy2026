name: Annecy Reservation Poller

on:
  push:
    branches:
      - claude/reservation-polling-proposal-fjswa9
    paths:
      - '.github/workflows/poll-annecy.yml'
      - 'scripts/poll_annecy.js'

jobs:
  poll-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install playwright

      - name: Install Chromium and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run reservation poller
        env:
          ANNECY_EMAIL: matt@uservox.com
          ANNECY_PASSWORD: ${{ secrets.ANNECY_PASSWORD }}
          SCREENSHOT_DIR: /tmp/annecy-screenshots
        run: node scripts/poll_annecy.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/annecy-screenshots/
          if-no-files-found: warn
          retention-days: 1
