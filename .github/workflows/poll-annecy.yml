name: Annecy Reservation Poller

on:
  push:
    branches:
      - claude/reservation-polling-proposal-fjswa9
    paths:
      - '.github/workflows/poll-annecy.yml'
      - 'scripts/poll_annecy.js'

jobs:
  poll-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install playwright

      - name: Install Chromium and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Install Xvfb (virtual display for non-headless mode)
        run: sudo apt-get install -y xvfb

      - name: Run reservation poller
        env:
          ANNECY_EMAIL: matt@uservox.com
          ANNECY_PASSWORD: ${{ secrets.ANNECY_PASSWORD }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          node scripts/poll_annecy.js
